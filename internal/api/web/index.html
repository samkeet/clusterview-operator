<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClusterView</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>ClusterView</h1>
    <div id="summary" class="summary">Loading…</div>
    <div id="updated" class="updated"></div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="content">
    <section id="nodes" class="nodes" aria-label="Nodes"></section>

    <section id="pods" class="pods" aria-label="Pods on the selected node" hidden>
      <div class="pods-head">
        <h2 id="pods-title"></h2>
        <button id="pods-close" type="button">Close</button>
      </div>
      <div id="pods-banner" class="banner" role="status" hidden></div>
      <table>
        <thead>
          <tr><th>Namespace</th><th>Name</th><th>Phase</th><th class="num">Restarts</th></tr>
        </thead>
        <tbody id="pods-body"></tbody>
      </table>
      <p id="pods-empty" class="muted" hidden>No pods on this node.</p>
    </section>
  </main>

  <!-- Pod drawer: an overlay, not modal, so the pod table stays usable behind it. -->
  <aside id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
    <div class="d-head">
      <h2 id="drawer-title" class="mono"></h2>
      <button id="drawer-close" class="x" type="button" aria-label="Close pod details">×</button>
    </div>
    <div id="drawer-facts" class="facts"></div>
    <div id="drawer-banner" class="banner" role="status" hidden></div>
    <div id="drawer-tabs" class="tabs" role="tablist" aria-label="Pod views">
      <button id="tab-events" class="tab" type="button" role="tab" aria-controls="panel-events" data-tab="events">Events</button>
      <button id="tab-logs" class="tab" type="button" role="tab" aria-controls="panel-logs" data-tab="logs">Logs</button>
      <button id="tab-details" class="tab" type="button" role="tab" aria-controls="panel-details" data-tab="details">Details</button>
    </div>
    <div class="d-body">
      <div id="panel-events" class="panel" role="tabpanel" aria-labelledby="tab-events" data-tab="events" hidden>
        <div id="events-note" class="note" role="status" hidden>
          <span>New events on page 1.</span>
          <button id="events-note-go" type="button">Go to page 1</button>
        </div>
        <div id="events-banner" class="banner" role="status" hidden></div>
        <p class="muted hint">Newest first</p>
        <ol id="events-list" class="events"></ol>
        <p id="events-empty" class="muted pad" hidden>No events for this pod. Kubernetes keeps events for about an hour.</p>
      </div>
      <div id="panel-logs" class="panel" role="tabpanel" aria-labelledby="tab-logs" data-tab="logs" hidden>
        <p class="muted pad">Pod logs will show here in a later release.</p>
      </div>
      <div id="panel-details" class="panel" role="tabpanel" aria-labelledby="tab-details" data-tab="details" hidden>
        <dl id="details" class="details"></dl>
      </div>
    </div>
    <nav id="events-pager" class="d-foot pager" aria-label="Event pages" hidden></nav>
  </aside>
</body>
</html>
