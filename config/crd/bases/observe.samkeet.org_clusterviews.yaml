---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusterviews.observe.samkeet.org
spec:
  group: observe.samkeet.org
  names:
    kind: ClusterView
    listKind: ClusterViewList
    plural: clusterviews
    shortNames:
    - cv
    singular: clusterview
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.readyNodes
      name: Ready
      type: integer
    - jsonPath: .status.podCount
      name: Pods
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterView is the Schema for the clusterviews API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines what to observe
            properties:
              namespaces:
                description: |-
                  namespaces limits which pods are counted. Empty means all namespaces.
                  Nodes are always cluster-wide, since a namespace filter on nodes has no meaning.
                items:
                  maxLength: 63
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              refreshInterval:
                default: 10s
                description: |-
                  refreshInterval is the minimum time between status writes, not a polling
                  interval. Reads come from the informer cache. This only caps how often the
                  summary is written back to the API server, so bursts of pod churn coalesce.
                type: string
            type: object
            x-kubernetes-validations:
            - message: refreshInterval must be between 5s and 10m
              rule: '!has(self.refreshInterval) || (duration(self.refreshInterval)
                >= duration(''5s'') && duration(self.refreshInterval) <= duration(''10m''))'
          status:
            description: status is the observed, aggregated cluster state
            properties:
              conditions:
                description: 'conditions: Ready=True when the last reconcile observed
                  and recorded state successfully.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdated:
                description: |-
                  lastUpdated is when the status content last changed (and so was last written).
                  The controller also uses it as the start of the write-throttle window.
                format: date-time
                type: string
              nodeCount:
                format: int32
                type: integer
              nodes:
                description: nodes holds per-node readiness and pod counts.
                items:
                  description: |-
                    NodeSummary is the per-node slice of the status. It holds counts only. Pod and
                    resource detail is served by the HTTP API so the CR stays small on big clusters.
                  properties:
                    name:
                      description: name of the node.
                      type: string
                    podCount:
                      description: podCount is the number of pods bound to this node
                        that pass the namespace filter.
                      format: int32
                      type: integer
                    status:
                      description: status derived from the node's Ready condition.
                      enum:
                      - Ready
                      - NotReady
                      - Unknown
                      type: string
                  required:
                  - name
                  - podCount
                  - status
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              notReadyNodes:
                description: notReadyNodes counts nodes whose status is NotReady or
                  Unknown.
                format: int32
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              podCount:
                description: podCount is the number of pods that pass the namespace
                  filter, including unscheduled ones.
                format: int32
                type: integer
              podPhases:
                additionalProperties:
                  format: int32
                  type: integer
                description: podPhases maps a pod phase (Pending, Running, Succeeded,
                  Failed, Unknown) to a count.
                type: object
              readyNodes:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
