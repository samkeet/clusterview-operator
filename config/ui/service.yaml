# ClusterIP for now: reach it with kubectl port-forward (see README). The API has no
# auth, so it goes public (LoadBalancer) only after it's been checked locally.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: system
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: clusterview-operator
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
