apiVersion: observe.samkeet.org/v1alpha1
kind: ClusterView
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  # The API server's --clusterview-name flag defaults to this name.
  name: cluster
spec:
  # Empty = count pods in every namespace.
  namespaces: []
  # Minimum time between status writes (not a polling interval).
  refreshInterval: 10s
