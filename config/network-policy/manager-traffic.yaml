# Network access for the manager pod. Standard networking.k8s.io/v1 only, so it
# works on any CNI that enforces NetworkPolicy (Cilium on DOKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: clusterview-operator
  policyTypes:
    - Ingress
  ingress:
    # Probes. Traffic from the pod's own node (the kubelet) is already allowed by
    # NetworkPolicy semantics; this rule keeps them working on a stricter CNI.
    - ports:
        - port: health
          protocol: TCP
    # No rule for 8080 (http) yet: the API has no auth, so in-cluster pods are
    # blocked until the LoadBalancer step opens it. kubectl port-forward still
    # works, because it connects over the pod's loopback, which policy never sees.
