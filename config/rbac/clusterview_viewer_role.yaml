# This rule is not used by the project clusterview-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to observe.samkeet.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterview-viewer-role
rules:
- apiGroups:
  - observe.samkeet.org
  resources:
  - clusterviews
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - observe.samkeet.org
  resources:
  - clusterviews/status
  verbs:
  - get
