---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - list
  - watch
- apiGroups:
  - observe.samkeet.org
  resources:
  - clusterviews
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - observe.samkeet.org
  resources:
  - clusterviews/status
  verbs:
  - patch
