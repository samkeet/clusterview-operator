apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager
  namespace: system
# The GHCR package is private while the repo is private. The secret is created
# out-of-band (see README) so no credential is ever committed.
imagePullSecrets:
- name: ghcr-pull
