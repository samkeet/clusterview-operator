# permissions to do leader election.
# No configmaps rule: controller-runtime defaults to the Leases lock and
# cmd/main.go doesn't override it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
rules:
# client-go's LeaseLock only calls Get, Create and Update. Releasing the lease
# (LeaderElectionReleaseOnCancel) is also an Update.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
# The leader-election event recorder (core/v1 sink) only calls Create and Patch.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
